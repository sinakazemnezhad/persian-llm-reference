name: publish-distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: PLR version to verify/publish (e.g. 0.13.1)
        required: true
        default: "0.13.1"

# Do not restrict permissions — repo secrets (HF_TOKEN) must inject into jobs

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version
        id: ver
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
      - run: node scripts/verify-release-integrity.mjs
        env:
          PLR_RELEASE: ${{ steps.ver.outputs.version }}

  zenodo:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version
        id: ver
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
      - name: Publish Zenodo snapshot
        working-directory: workspace
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then echo "SKIP Zenodo — add ZENODO_TOKEN repo secret"; exit 0; fi
          npm run build
          node scripts/publish-zenodo.mjs
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          PLR_RELEASE: ${{ steps.ver.outputs.version }}

  huggingface:
    needs: verify
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve release version
        id: ver
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
      - name: Publish HF dataset
        working-directory: workspace
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "RED  HF_TOKEN missing — add repository secret HF_TOKEN"
            exit 1
          fi
          npm install
          npm run build
          pip install huggingface_hub
          node scripts/publish-hf-dataset.mjs
        env:
          PLR_RELEASE: ${{ steps.ver.outputs.version }}
