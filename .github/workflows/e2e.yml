name: e2e
on:
  push:
    paths:
      - "data/**"
      - "workspace/**"
  pull_request:
    paths:
      - "data/**"
      - "workspace/**"
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: npm run validate:links
      - run: node src/server.mjs &
      - run: sleep 2 && npm run e2e
